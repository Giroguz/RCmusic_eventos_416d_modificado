<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adquirir un plan · RC music_eventos</title><link rel="stylesheet" href="/assets/index.css"></head><body><div id="root"></div><script src="/assets/plans-screen-20260917.js?v=8"></script><style>.rcp-back{display:inline-block!important}.rcp-payment-link{display:inline-block;margin-top:10px;color:#0070ba;font-weight:800;text-decoration:underline;word-break:break-all}</style><script>(()=>{try{sessionStorage.setItem('rc_payment_return_pending',JSON.stringify({hash:'#dj',at:Date.now()}))}catch{}const m='https://link.mercadopago.com.pe/rcmusiceventos',p='https://paypal.me/rcmusiceventos';const get=()=>{try{const a=JSON.parse(localStorage.getItem('rc_payment_settings_v1')||'{}'),b=JSON.parse(localStorage.getItem('rc_paypal_settings_v1')||'{}');return{m:a.mercadoLink||m,p:a.paypalLink||b.link||p}}catch{return{m,p}}};function setupBack(){}document.addEventListener('DOMContentLoaded',setupBack,{once:true});new MutationObserver(setupBack).observe(document.body,{childList:true,subtree:true});document.addEventListener('click',e=>{const b=e.target.closest?.('#rcp-back,#rcp-close');if(b){e.preventDefault();e.stopImmediatePropagation();try{sessionStorage.removeItem('rc_payment_return_pending')}catch{}location.replace(location.origin+'/#dj')}},true);function add(){const box=document.querySelector('#rc-plans .rcp-yape'),sel=document.querySelector('#rc-plans .rcp-method.sel');if(!box||!sel)return;const t=sel.textContent||'',url=/Mercado/i.test(t)?get().m:/PayPal/i.test(t)?get().p:'';let a=box.querySelector('.rcp-payment-link');if(!url){a?.remove();return}if(!a){a=document.createElement('a');a.className='rcp-payment-link';a.target='_blank';a.rel='noopener noreferrer';box.appendChild(a)}a.href=url;a.textContent=/Mercado/i.test(t)?'Abrir enlace de Mercado Pago':'Abrir enlace de PayPal'}document.addEventListener('click',e=>{if(e.target.closest?.('[data-method]

</head><body><div id="root"></div><script>try{const k="rc_admin_subscription_settings_v1";const v=JSON.parse(localStorage.getItem(k)||"null");if(v&&Array.isArray(v.plans)){v.plans=v.plans.map(p=>({...p,planType:p.planType||p.plan_type||p.id}));localStorage.setItem(k,JSON.stringify(v))}}catch(e){}</script><script type="module" src="/assets/index-dj-drive-plan-gate-20260914.js?v=20260914-2357"></script><script>
(() => {
  const oldText = "¿No encuentras tu canción?";
  const newText = "¿No encuentras tu canción o prefieres escribirla?";
  const replaceText = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      if (node.nodeValue.includes(oldText)) node.nodeValue = node.nodeValue.replaceAll(oldText, newText);
    });
  };
  new MutationObserver(replaceText).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  replaceText();
})();
</script><script>
(() => {
  const style = document.createElement('style');
  style.textContent = '[data-zapia-toast-clone="true"] { position: fixed !important; inset: 50% auto auto 50% !important; transform: translate(-50%, -50%) !important; z-index: 20000 !important; }';
  document.head.appendChild(style);
  let clone = null;
  let lastText = '';
  let timer = null;
  const findSource = () => Array.from(document.querySelectorAll('div')).find((node) => !node.dataset.zapiaToastClone && String(node.className).includes('z-[12000]') && node.textContent.trim());
  const sync = () => {
    const source = findSource();
    if (!source) return;
    const text = source.textContent.trim();
    source.style.visibility = 'hidden';
    source.style.pointerEvents = 'none';
    if (!text || text === lastText) return;
    lastText = text;
    if (clone) clone.remove();
    clone = source.cloneNode(true);
    clone.dataset.zapiaToastClone = 'true';
    Object.assign(clone.style, { position: 'fixed', left: '50%', top: '50%', right: 'auto', bottom: 'auto', transform: 'translate(-50%, -50%)', zIndex: '20000', visibility: 'visible', display: 'flex', pointerEvents: 'none' });
    document.body.appendChild(clone);
    clearTimeout(timer);
    timer = setTimeout(() => { if (clone) clone.style.display = 'none'; }, 3000);
  };
  new MutationObserver(sync).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  setInterval(sync, 250);
  sync();
})();
</script></body></html>

</head><body><div id="root"></div><script>try{const k="rc_admin_subscription_settings_v1";const v=JSON.parse(localStorage.getItem(k)||"null");if(v&&Array.isArray(v.plans)){v.plans=v.plans.map(p=>({...p,planType:p.planType||p.plan_type||p.id}));localStorage.setItem(k,JSON.stringify(v))}}catch(e){}</script><script type="module" src="/assets/index-dj-drive-plan-gate-20260914.js?v=20260914-2352"></script><script>
(() => {
  const oldText = "¿No encuentras tu canción?";
  const newText = "¿No encuentras tu canción o prefieres escribirla?";
  const replaceText = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      if (node.nodeValue.includes(oldText)) node.nodeValue = node.nodeValue.replaceAll(oldText, newText);
    });
  };
  new MutationObserver(replaceText).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  replaceText();
})();
</script><script>
(() => {
  const style = document.createElement('style');
  style.textContent = '[class~="z-[12000]"] { position: fixed !important; top: 50% !important; left: 50% !important; right: auto !important; bottom: auto !important; transform: translate(-50%, -50%) !important; }';
  document.head.appendChild(style);
  let lastText = '';
  let timer = null;
  const sync = () => {
    document.querySelectorAll('[class~="z-[12000]"]').forEach((node) => {
      const text = node.textContent.trim();
      if (!text) return;
      node.style.display = 'flex';
      if (text !== lastText) {
        lastText = text;
        clearTimeout(timer);
        timer = setTimeout(() => { node.style.display = 'none'; }, 3000);
      }
    });
  };
  new MutationObserver(sync).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  setInterval(sync, 250);
  sync();
})();
</script></body></html>

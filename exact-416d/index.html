(() => {
  const oldText = "¿No encuentras tu canción?";
  const newText = "¿No encuentras tu canción o prefieres escribirla?";
  const replaceText = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      if (node.nodeValue.includes(oldText)) node.nodeValue = node.nodeValue.replaceAll(oldText, newText);
    });
  };
  new MutationObserver(replaceText).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  replaceText();
})();
</script><script>
(() => {
  let lastText = '';
  let timer = null;
  let overlay = null;
  const successText = /(copiad|guardad|actualizad|eliminad|activad|aceptad|rechazad|configurad|demo .*d[ií]a|n[uú]mero de yape|qr de yape|registros .*historial)/i;
  const findDeveloperNotice = () => Array.from(document.querySelectorAll('div')).find((node) => { const text = node.textContent.trim(); return node.classList.contains('border') && node.classList.contains('rounded-2xl') && text && text.length <= 220 && successText.test(text); });
  const ensureOverlay = () => {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.setAttribute('role', 'status');
    overlay.setAttribute('aria-live', 'polite');
    Object.assign(overlay.style, {
      position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%, -50%)', zIndex: '20000',
      display: 'none', alignItems: 'center', gap: '8px', maxWidth: 'calc(100vw - 32px)',
      padding: '12px 20px', border: '1px solid rgba(184,255,61,.4)', borderRadius: '16px',
      background: 'rgba(11,11,16,.98)', color: '#b8ff3d', fontSize: '14px', fontWeight: '700',
      textAlign: 'center', boxShadow: '0 0 35px rgba(45,255,214,.28)', pointerEvents: 'none'
    });
    document.body.appendChild(overlay);
    return overlay;
  };
  const show = (text) => {
    const view = ensureOverlay();
    view.replaceChildren();
    const icon = document.createElement('span'); icon.textContent = '✓'; icon.setAttribute('aria-hidden', 'true');
    const message = document.createElement('span'); message.textContent = text;
    view.append(icon, message); view.style.display = 'flex';
    clearTimeout(timer); timer = setTimeout(() => { view.style.display = 'none'; }, 3000);
  };
  const sync = () => {
    const source = findDeveloperNotice();
    if (!source) return;
    const text = source.textContent.trim();
    source.style.display = 'none';
    if (text && text !== lastText) { lastText = text; show(text); }
  };
  new MutationObserver(sync).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  setInterval(sync, 250);
})();


<script>(() => { const refreshPaypalStatus = () => { try { const settings = JSON.parse(localStorage.getItem('rc_payment_settings_v1') || '{}'); if (!settings.paypalEnabled || !settings.paypalLink) return; document.querySelectorAll('p').forEach((node) => { if (node.textContent.trim() !== 'El desarrollador todavía debe configurar el enlace de PayPal.') return; node.textContent = settings.paypalEmail ? `Cuenta receptora: ${settings.paypalEmail} · ${settings.paypalCurrency || 'USD'}` : `PayPal configurado · ${settings.paypalCurrency || 'USD'}`; }); } catch {} }; new MutationObserver(refreshPaypalStatus).observe(document.documentElement, { childList: true, subtree: true, characterData: true }); setInterval(refreshPaypalStatus, 500); refreshPaypalStatus(); })();</script>

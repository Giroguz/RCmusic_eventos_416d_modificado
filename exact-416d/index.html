
<script>(()=>{let timer;let last='';const sync=async()=>{const inputs=[...document.querySelectorAll('input')];const email=inputs.find(i=>i.type==='email'&&i.closest('form'))?.value.trim().toLowerCase()||'';const code=inputs.find(i=>i.type==='password'||i.getAttribute('autocomplete')==='one-time-code')?.value.trim()||'';const demo=[...document.querySelectorAll('button')].find(b=>b.textContent.trim().startsWith('Probar demo gratis'));if(!email||!code||code.length<6){if(demo){demo.style.display=''}document.getElementById('rc-demo-plan-notice')?.remove();return}const key=email+'|'+code;if(key===last)return;last=key;try{const response=await fetch('https://rc-music-eventos-dj-proxy.gianfranguz.workers.dev/api/dj/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_email:email,p_code:code})});if(!response.ok)return;const access=await response.json();if(!access?.session_token)return;const button=[...document.querySelectorAll('button')].find(b=>b.textContent.trim().startsWith('Probar demo gratis'));if(button){button.style.display='none';if(!document.getElementById('rc-demo-plan-notice')){const notice=document.createElement('p');notice.id='rc-demo-plan-notice';notice.textContent='Este usuario ya está registrado. Adquiere un plan para continuar.';notice.style.cssText='margin-top:1rem;text-align:center;color:#67e8f9;font-size:.875rem;font-weight:700';button.parentNode.insertBefore(notice,button)}}}catch{}};document.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(sync,350)},true);new MutationObserver(()=>sync()).observe(document.body,{childList:true,subtree:true});sync()})();</script>

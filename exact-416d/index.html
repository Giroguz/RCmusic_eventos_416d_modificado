</head><body><div id="root"></div><script>try{const k="rc_admin_subscription_settings_v1";const v=JSON.parse(localStorage.getItem(k)||"null");if(v&&Array.isArray(v.plans)){v.plans=v.plans.map(p=>({...p,planType:p.planType||p.plan_type||p.id}));localStorage.setItem(k,JSON.stringify(v))}}catch(e){}</script><script type="module" src="/assets/index-dj-drive-plan-gate-20260914.js?v=20260914-2315"></script><script>
(() => {
  const oldText = "¿No encuentras tu canción?";
  const newText = "¿No encuentras tu canción o prefieres escribirla?";
  const replaceText = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      if (node.nodeValue.includes(oldText)) node.nodeValue = node.nodeValue.replaceAll(oldText, newText);
    });
  };
  new MutationObserver(replaceText).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  replaceText();
})();
